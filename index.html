    // --- LEAFLET MAP VISUALIZER ---
    function MapViewComponent({ pg, college }) {
      const mapRef = useRef(null);
      const instanceRef = useRef(null);

      useEffect(() => {
        if (!mapRef.current || !window.L) return;

        try {
          if (instanceRef.current) {
            instanceRef.current.remove();
          }

          const centerLat = pg ? pg.lat : (college ? college.lat : 18.6517);
          const centerLng = pg ? pg.lng : (college ? college.lng : 73.7616);

          const map = L.map(mapRef.current).setView([centerLat, centerLng], 14);
          instanceRef.current = map;

          L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
          }).addTo(map);

          if (college) {
            const colIcon = L.divIcon({
              className: 'col-marker',
              html: `<div style="background:#034ea2; color:white; padding:4px 8px; border-radius:12px; font-weight:bold; font-size:10px; border:2px solid white;">🎓 ${college.code}</div>`
            });
            L.marker([college.lat, college.lng], { icon: colIcon }).addTo(map).bindPopup(`<b>${college.name}</b>`);
          }

          if (pg) {
            const pgIcon = L.divIcon({
              className: 'pg-marker',
              html: `<div style="background:#059669; color:white; padding:4px 8px; border-radius:12px; font-weight:bold; font-size:10px; border:2px solid white;">🏠 ${pg.name}</div>`
            });
            L.marker([pg.lat, pg.lng], { icon: pgIcon }).addTo(map).bindPopup(`<b>${pg.name}</b><br/>₹${pg.rentPerMonth}/mo`);
          }

        } catch (e) {
          console.log('Map note:', e);
        }
      }, [pg, college]);

      return <div ref={mapRef} className="w-full h-64 rounded-2xl overflow-hidden border border-slate-200" />;
    }

                          <div className="p-4 pt-0 border-t border-slate-100 flex justify-between items-baseline">
                            <div>
                              <span className="text-base font-extrabold text-sky-700">₹{pg.rentPerMonth}</span>
                              <span className="text-[10px] text-slate-400 block">Deposit: ₹{pg.securityDeposit}</span>
                            </div>
                            <button onClick={() => setSelectedPGDetails(pg)} className="px-3 py-1.5 bg-sky-600 text-white font-bold text-xs rounded-lg">View Details</button>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              </div>
            )}

            {/* COLLEGES TAB VIEW */}
            {activeTab === 'colleges' && !showAdminPortal && (
              <div className="max-w-7xl mx-auto px-4 py-8 space-y-6">
                <h1 className="text-3xl font-extrabold text-slate-900">Supported Colleges & Universities</h1>
                <div className="grid grid-cols-1 sm:grid-cols-3 gap-6">
                  {colleges.map(c => (
                    <div key={c.id} onClick={() => { setSelectedCollegeId(c.id); setActiveTab('pgs'); }} className="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm hover:shadow-md cursor-pointer flex items-center gap-4">
                      <img src={c.image} className="w-16 h-16 rounded-xl object-cover" />
                      <div>
                        <h3 className="font-bold text-slate-900">{c.name}</h3>
                        <p className="text-xs text-slate-500">{c.city}, {c.state}</p>
                        <span className="text-[10px] font-bold text-sky-700 bg-sky-50 px-2 py-0.5 rounded">Explore Nearby PGs</span>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

          </main>

          {/* Footer */}
          <footer className="bg-slate-900 text-slate-400 py-8 px-4 text-center text-xs space-y-2 border-t border-slate-800">
            <p className="font-extrabold text-white text-sm">StayNest Student PG Accommodation Platform</p>
            <p>© 2026 Academic Community Project. Designed for students across India.</p>
          </footer>

          {/* COMPLETE PG DETAILS MODAL */}
          {selectedPGDetails && (
            <div className="fixed inset-0 z-50 bg-slate-900/70 backdrop-blur-md flex items-center justify-center p-4 overflow-y-auto">
              <div className="bg-white rounded-3xl max-w-4xl w-full p-6 space-y-6 max-h-[92vh] overflow-y-auto border shadow-2xl relative">
                
                <div className="flex justify-between items-start border-b pb-4">
                  <div>
                    <span className="px-2.5 py-0.5 rounded-full text-xs font-bold bg-emerald-100 text-emerald-800">🟢 Verified PG</span>
                    <h2 className="text-2xl font-extrabold text-slate-900 mt-1">{selectedPGDetails.name}</h2>
                    <p className="text-xs text-slate-500">📍 {selectedPGDetails.address}, {selectedPGDetails.area}, {selectedPGDetails.city}, {selectedPGDetails.pincode}</p>
                  </div>
                  <button onClick={() => setSelectedPGDetails(null)} className="p-2 text-slate-400 hover:text-slate-800 font-bold text-xl">✕</button>
                </div>

                {/* Photos Gallery */}
                <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                  {selectedPGDetails.photos.map((p, idx) => (
                    <img key={idx} src={p} className="w-full h-44 object-cover rounded-2xl border" />
                  ))}
                </div>

                {/* Pricing, Beds, Sharing Grid */}
                <div className="grid grid-cols-1 sm:grid-cols-4 gap-4 p-4 bg-slate-50 rounded-2xl border text-xs">
                  <div>
                    <span className="text-[10px] font-bold text-slate-400 uppercase block">Monthly Rent</span>
                    <span className="text-xl font-extrabold text-sky-700">₹{selectedPGDetails.rentPerMonth.toLocaleString('en-IN')} / mo</span>
                  </div>
                  <div>
                    <span className="text-[10px] font-bold text-slate-400 uppercase block">Security Deposit</span>
                    <span className="text-base font-bold text-slate-900">₹{selectedPGDetails.securityDeposit.toLocaleString('en-IN')}</span>
                  </div>
                  <div>
                    <span className="text-[10px] font-bold text-slate-400 uppercase block">Beds Available</span>
                    <span className="text-base font-extrabold text-emerald-700">{selectedPGDetails.availableBeds} / {selectedPGDetails.totalBeds} Beds</span>
                  </div>
                  <div>
                    <span className="text-[10px] font-bold text-slate-400 uppercase block">Room Sharing</span>
                    <span className="text-base font-bold capitalize text-slate-900">{selectedPGDetails.sharingTypes.join(', ')}</span>
                  </div>
                </div>

                {selectedPGDetails.extraChargesDescription && (
                  <p className="text-xs italic text-slate-500 bg-amber-50 p-3 rounded-xl border border-amber-200">ℹ️ {selectedPGDetails.extraChargesDescription}</p>
                )}

                {/* Nearby Colleges & Distance */}
                <div>
                  <h4 className="font-bold text-slate-900 text-sm mb-2">Distance from Nearby Colleges:</h4>
                  <div className="flex flex-wrap gap-2">
                    {selectedPGDetails.nearbyColleges.map((c, i) => (
                      <span key={i} className="px-3 py-1.5 bg-amber-100 text-amber-900 font-bold text-xs rounded-xl border border-amber-200">
                        📍 {c.distanceKm} km from {c.collegeName}
                      </span>
                    ))}
                  </div>
                </div>

                {/* Facilities Checklist Grid */}
                <div>
                  <h4 className="font-bold text-slate-900 text-sm mb-2">Facilities & Amenities Provided:</h4>
                  <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
                    {selectedPGDetails.facilities.map((f, i) => (
                      <div key={i} className="p-2 bg-slate-50 border rounded-xl text-xs font-semibold flex items-center gap-1.5 text-slate-800">
                        <span className="text-emerald-600 font-bold">✓</span> {f}
                      </div>
                    ))}
                  </div>
                </div>

                {/* Owner Information Box */}
                <div className="p-4 bg-sky-50 rounded-2xl border border-sky-200 space-y-2 text-xs">
                  <h4 className="font-bold text-sky-950 text-sm">Owner Contact Details</h4>
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                    <p className="text-slate-800 font-semibold">Owner Name: <span className="font-bold">{selectedPGDetails.ownerName}</span></p>
                    <p className="text-sky-700 font-extrabold text-sm">Phone: <a href={`tel:${selectedPGDetails.ownerPhone}`} className="hover:underline">{selectedPGDetails.ownerPhone}</a></p>
                    {selectedPGDetails.ownerEmail && <p className="text-slate-700">Email: {selectedPGDetails.ownerEmail}</p>}
                    {selectedPGDetails.googleMapUrl && (
                      <a href={selectedPGDetails.googleMapUrl} target="_blank" className="text-sky-600 font-bold hover:underline">
                        🗺️ View on Google Maps →
                      </a>
                    )}
                  </div>
                </div>

                {/* Map Visualizer */}
                <div>
                  <h4 className="font-bold text-slate-900 text-sm mb-2">Map Location:</h4>
                  <MapViewComponent pg={selectedPGDetails} college={selectedCollege} />
                </div>

                {/* Student Reviews & Form */}
                <div className="border-t pt-4 space-y-4">
                  <div className="flex justify-between items-center">
                    <h4 className="font-bold text-slate-900 text-base">Verified Student Reviews (⭐ {selectedPGDetails.rating})</h4>
                    <span className="text-xs font-semibold text-slate-500">{reviews.filter(r => r.pgId === selectedPGDetails.id).length} reviews</span>
                  </div>

                  {/* Add Review Form */}
                  <form onSubmit={handleAddReview} className="p-4 bg-slate-50 rounded-2xl border space-y-3 text-xs">
                    <h5 className="font-bold text-slate-900">Write a Review</h5>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                      <input required placeholder="Your Name" value={revAuthor} onChange={e => setRevAuthor(e.target.value)} className="p-2 border rounded-lg bg-white" />
                      <input required placeholder="Your College (e.g. PCCOE)" value={revCollege} onChange={e => setRevCollege(e.target.value)} className="p-2 border rounded-lg bg-white" />
                    </div>
                    <div className="flex items-center gap-2">
                      <span className="font-semibold">Rating:</span>
                      {[1, 2, 3, 4, 5].map(s => (
                        <button type="button" key={s} onClick={() => setRevRating(s)} className={`px-2.5 py-1 rounded border font-bold ${revRating === s ? 'bg-amber-400 text-slate-900' : 'bg-white'}`}>{s} ⭐</button>
                      ))}
                    </div>
                    <textarea required rows={2} placeholder="Write review..." value={revComment} onChange={e => setRevComment(e.target.value)} className="w-full p-2 border rounded-lg bg-white" />
                    <button type="submit" className="px-4 py-2 bg-sky-600 text-white font-bold rounded-lg">Submit Review</button>
                  </form>

                  {/* Reviews List */}
                  <div className="space-y-2">
                    {reviews.filter(r => r.pgId === selectedPGDetails.id).map(r => (
                      <div key={r.id} className="p-3 bg-white border rounded-xl text-xs space-y-1">
                        <div className="flex justify-between font-bold">
                          <span>{r.authorName} ({r.collegeName})</span>
                          <span className="text-amber-500">⭐ {r.rating}</span>
                        </div>
                        <p className="text-slate-700">{r.comment}</p>
                      </div>
                    ))}
                  </div>
                </div>

              </div>
            </div>
          )}

          {/* COMPLETE OWNER ADD PG MODAL WITH PHOTO UPLOADER */}
          {showAddPGModal && (
            <div className="fixed inset-0 z-50 bg-slate-900/70 backdrop-blur-md flex items-center justify-center p-4 overflow-y-auto">
              <div className="bg-white rounded-3xl max-w-2xl w-full p-6 space-y-4 max-h-[90vh] overflow-y-auto shadow-2xl border">
                
                <div className="flex justify-between items-center border-b pb-3">
                  <h2 className="text-lg font-bold text-slate-900">📷 Add Your PG (Owner Property Registration)</h2>
                  <button onClick={() => { setShowAddPGModal(false); setFormSubmitted(false); }} className="text-slate-400 font-bold text-xl">✕</button>
                </div>

                {formSubmitted ? (
                  <div className="p-6 text-center space-y-3">
                    <div className="w-12 h-12 bg-amber-100 text-amber-800 rounded-full flex items-center justify-center text-xl font-bold mx-auto">🟡</div>
                    <h3 className="text-xl font-bold text-slate-900">Submission Logged Successfully!</h3>
                    <p className="text-xs text-slate-600 bg-amber-50 p-4 rounded-xl border border-amber-200">
                      Your PG listing with <strong>{uploadedPhotos.length} photo(s)</strong> has been saved with status: <strong>🟡 Pending Verification</strong>.<br/>
                      An administrator will review photos, owner credentials, and rent before granting the 🟢 Verified badge.
                    </p>
                    <button onClick={() => { setShowAddPGModal(false); setFormSubmitted(false); }} className="px-6 py-2.5 bg-slate-900 text-white font-bold text-xs rounded-xl">Done</button>
                  </div>
                ) : (
                  <form onSubmit={handleOwnerSubmit} className="space-y-4 text-xs">
                    
                    {/* Owner Details */}
                    <div className="p-3 bg-slate-50 rounded-xl space-y-2">
                      <h4 className="font-bold uppercase text-slate-700 text-[11px]">1. Owner Contact Details</h4>
                      <div className="grid grid-cols-1 sm:grid-cols-3 gap-2">
                        <input required placeholder="Owner Name *" value={ownerName} onChange={e => setOwnerName(e.target.value)} className="p-2 border rounded bg-white" />
                        <input required placeholder="Phone Number *" value={ownerPhone} onChange={e => setOwnerPhone(e.target.value)} className="p-2 border rounded bg-white" />
                        <input placeholder="Email (Optional)" value={ownerEmail} onChange={e => setOwnerEmail(e.target.value)} className="p-2 border rounded bg-white" />
                      </div>
                    </div>

                    {/* PG Basics */}
                    <div className="p-3 bg-slate-50 rounded-xl space-y-2">
                      <h4 className="font-bold uppercase text-slate-700 text-[11px]">2. Property Basics</h4>
                      <div className="grid grid-cols-1 sm:grid-cols-3 gap-2">
                        <input required placeholder="PG Name *" value={pgName} onChange={e => setPgName(e.target.value)} className="p-2 border rounded bg-white font-bold sm:col-span-2" />
                        <select value={pgGender} onChange={e => setPgGender(e.target.value)} className="p-2 border rounded bg-white font-bold">
                          <option value="boys">Boys PG</option>
                          <option value="girls">Girls PG</option>
                          <option value="unisex">Unisex Co-Living</option>
                        </select>
                      </div>
                      <input placeholder="Tagline / Short catchphrase" value={pgTagline} onChange={e => setPgTagline(e.target.value)} className="w-full p-2 border rounded bg-white" />
                    </div>

                    {/* Address & Google Maps */}
                    <div className="p-3 bg-slate-50 rounded-xl space-y-2">
                      <h4 className="font-bold uppercase text-slate-700 text-[11px]">3. Address & Google Maps Link</h4>
                      <div className="grid grid-cols-1 sm:grid-cols-3 gap-2">
                        <input required placeholder="City *" value={pgCity} onChange={e => setPgCity(e.target.value)} className="p-2 border rounded bg-white" />
                        <input required placeholder="Area / Locality *" value={pgArea} onChange={e => setPgArea(e.target.value)} className="p-2 border rounded bg-white" />
                        <input required placeholder="Pincode *" value={pgPincode} onChange={e => setPgPincode(e.target.value)} className="p-2 border rounded bg-white" />
                      </div>
                      <input required placeholder="Full Street Address *" value={pgAddress} onChange={e => setPgAddress(e.target.value)} className="w-full p-2 border rounded bg-white" />
                      <input placeholder="Google Maps Share Link URL (Optional)" value={googleMapUrl} onChange={e => setGoogleMapUrl(e.target.value)} className="w-full p-2 border rounded bg-white" />
                    </div>

                    {/* Nearby Colleges & Distance */}
                    <div className="p-3 bg-sky-50 rounded-xl space-y-2">
                      <h4 className="font-bold uppercase text-sky-900 text-[11px]">4. Nearby Colleges & Distance (km)</h4>
                      {nearbyCollegeInput.map((row, idx) => (
                        <div key={idx} className="flex gap-2 items-center bg-white p-2 rounded border">
                          <select
                            value={row.collegeId}
                            onChange={(e) => {
                              const col = colleges.find(c => c.id === e.target.value);
                              setNearbyCollegeInput(prev => {
                                const copy = [...prev];
                                copy[idx].collegeId = e.target.value;
                                copy[idx].collegeName = col ? col.name : 'College';
                                return copy;
                              });
                            }}
                            className="flex-1 p-1 border rounded text-xs font-bold"
                          >
                            {colleges.map(c => <option key={c.id} value={c.id}>{c.name} ({c.city})</option>)}
                          </select>
                          <input
                            type="number"
                            step="0.1"
                            value={row.distanceKm}
                            onChange={(e) => {
                              const val = parseFloat(e.target.value);
                              setNearbyCollegeInput(prev => {
                                const copy = [...prev];
                                copy[idx].distanceKm = val;
                                return copy;
                              });
                            }}
                            className="w-20 p-1 border rounded text-xs text-center font-bold"
                          />
                          <span className="font-bold">km</span>
                        </div>
                      ))}
                    </div>

                    {/* Pricing, Beds & Sharing */}
                    <div className="p-3 bg-slate-50 rounded-xl space-y-2">
                      <h4 className="font-bold uppercase text-slate-700 text-[11px]">5. Rent, Deposit, Beds & Sharing</h4>
                      <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
                        <div>
                          <label className="block text-[10px] font-semibold text-slate-500">Monthly Rent (₹)</label>
                          <input type="number" required value={rentPerMonth} onChange={e => setRentPerMonth(e.target.value)} className="w-full p-2 border rounded font-bold" />
                        </div>
                        <div>
                          <label className="block text-[10px] font-semibold text-slate-500">Security Deposit (₹)</label>
                          <input type="number" required value={securityDeposit} onChange={e => setSecurityDeposit(e.target.value)} className="w-full p-2 border rounded font-bold" />
                        </div>
                        <div>
                          <label className="block text-[10px] font-semibold text-slate-500">Total Beds</label>
                          <input type="number" required value={totalBeds} onChange={e => setTotalBeds(e.target.value)} className="w-full p-2 border rounded" />
                        </div>
                        <div>
                          <label className="block text-[10px] font-semibold text-slate-500">Available Beds</label>
                          <input type="number" required value={availableBeds} onChange={e => setAvailableBeds(e.target.value)} className="w-full p-2 border rounded font-bold text-emerald-700" />
                        </div>
                      </div>
                      <input placeholder="Extra charges note (e.g. Electricity billed per unit)" value={extraCharges} onChange={e => setExtraCharges(e.target.value)} className="w-full p-2 border rounded bg-white" />
                    </div>

                    {/* Facilities Checklist */}
                    <div className="p-3 bg-slate-50 rounded-xl space-y-2">
                      <h4 className="font-bold uppercase text-slate-700 text-[11px]">6. Facilities Provided</h4>
                      <div className="grid grid-cols-2 sm:grid-cols-3 gap-1.5">
                        {ALL_FACILITIES.map(fac => (
                          <label key={fac} className="flex items-center gap-1.5 p-1.5 bg-white border rounded">
                            <input
                              type="checkbox"
                              checked={pgFacilities.includes(fac)}
                              onChange={() => {
                                setPgFacilities(prev => prev.includes(fac) ? prev.filter(f => f !== fac) : [...prev, fac]);
                              }}
                              className="w-3.5 h-3.5 text-emerald-600"
                            />
                            <span>{fac}</span>
                          </label>
                        ))}
                      </div>
                    </div>

                    {/* Food Details */}
                    <div className="p-3 bg-slate-50 rounded-xl space-y-2">
                      <h4 className="font-bold uppercase text-slate-700 text-[11px]">7. Mess & Food Details</h4>
                      <label className="flex items-center gap-2 font-bold cursor-pointer">
                        <input type="checkbox" checked={foodAvailable} onChange={e => setFoodAvailable(e.target.checked)} className="w-4 h-4" />
                        <span>Mess / Food service available</span>
                      </label>
                      {foodAvailable && <input placeholder="Food details (e.g. 3 meals daily)" value={foodDetails} onChange={e => setFoodDetails(e.target.value)} className="w-full p-2 border rounded bg-white" />}
                    </div>

                    {/* EASY PHOTO UPLOADER & PREVIEWS SECTION */}
                    <div className="p-4 bg-sky-50 rounded-2xl border border-sky-200 space-y-3">
                      <div className="flex justify-between items-center">
                        <h4 className="font-bold uppercase text-sky-950 text-xs flex items-center gap-1">
                          📷 8. PG Photos Uploader ({uploadedPhotos.length} Added)
                        </h4>
                        <span className="text-[10px] text-sky-700 font-semibold">Multiple Uploads Allowed</span>
                      </div>

                      {/* File Input Box */}
                      <div className="p-4 bg-white border-2 border-dashed border-sky-300 rounded-xl text-center hover:bg-sky-50/50 transition-colors">
                        <input
                          type="file"
                          accept="image/*"
                          multiple
                          onChange={handleFileUpload}
                          className="hidden"
                          id="pg-photo-input"
                        />
                        <label htmlFor="pg-photo-input" className="cursor-pointer flex flex-col items-center gap-1">
                          <span className="text-2xl">📁</span>
                          <span className="font-bold text-sky-700 text-xs">Click to Choose Photos from Laptop / Phone</span>
                          <span className="text-[10px] text-slate-400">Supports JPG, PNG, WEBP (Multiple files supported)</span>
                        </label>
                      </div>

                      {/* Option to paste image URL */}
                      <div className="flex gap-2">
                        <input
                          type="text"
                          placeholder="Or paste an image web URL here..."
                          value={customUrlInput}
                          onChange={(e) => setCustomUrlInput(e.target.value)}
                          className="flex-1 p-2 border rounded-xl text-xs bg-white"
                        />
                        <button
                          type="button"
                          onClick={handleAddCustomUrl}
                          className="px-3 py-1.5 bg-sky-700 text-white font-bold text-xs rounded-xl hover:bg-sky-800"
                        >
                          + Add URL
                        </button>
                      </div>

                      {/* Presets shortcut */}
                      <div>
                        <span className="text-[10px] font-bold text-slate-500 block mb-1">Or Pick Quick Sample Photos:</span>
                        <div className="flex flex-wrap gap-1.5">
                          {SAMPLE_ROOM_PRESETS.map((preset, idx) => (
                            <button
                              type="button"
                              key={idx}
                              onClick={() => {
                                if (!uploadedPhotos.includes(preset.url)) {
                                  setUploadedPhotos(prev => [...prev, preset.url]);
                                }
                              }}
                              className="px-2 py-1 bg-white border border-sky-200 rounded-lg text-[10px] font-semibold text-sky-800 hover:bg-sky-100"
                            >
                              + {preset.name}
                            </button>
                          ))}
                        </div>
                      </div>

                      {/* Photo Thumbnails Preview Grid */}
                      {uploadedPhotos.length > 0 && (
                        <div className="space-y-1 pt-2 border-t border-sky-200">
                          <span className="text-[10px] font-bold text-slate-600 block">Uploaded Photo Previews:</span>
                          <div className="grid grid-cols-3 sm:grid-cols-4 gap-2">
                            {uploadedPhotos.map((photo, index) => (
                              <div key={index} className="relative group rounded-xl overflow-hidden border border-slate-200 bg-slate-900 h-20">
                                <img src={photo} alt={`Upload ${index}`} className="w-full h-full object-cover" />
                                <button
                                  type="button"
                                  onClick={() => handleRemovePhoto(index)}
                                  className="absolute top-1 right-1 bg-rose-600 text-white w-5 h-5 rounded-full flex items-center justify-center text-xs font-bold shadow-md hover:bg-rose-700"
                                  title="Remove photo"
                                >
                                  ✕
                                </button>
                              </div>
                            ))}
                          </div>
                        </div>
                      )}
                    </div>

                    <button type="submit" className="w-full py-3 bg-emerald-600 text-white font-extrabold rounded-xl hover:bg-emerald-700 shadow-md">
                      Submit PG for Admin Verification
                    </button>
                  </form>
                )}

              </div>
            </div>
          )}

          {/* ACADEMIC PROJECT DOCS MODAL */}
          {showDocModal && (
            <div className="fixed inset-0 z-50 bg-slate-900/70 backdrop-blur-md flex items-center justify-center p-4 overflow-y-auto">
              <div className="bg-white rounded-3xl max-w-3xl w-full p-6 space-y-4 max-h-[88vh] overflow-y-auto shadow-2xl border text-xs">
                <div className="flex justify-between items-center border-b pb-3">
                  <h2 className="text-base font-bold text-slate-900">Academic College Project Documentation (20 Sections)</h2>
                  <button onClick={() => setShowDocModal(false)} className="text-slate-400 font-bold text-xl">✕</button>
                </div>
                <div className="space-y-3 text-slate-800 leading-relaxed">
                  <h3 className="font-bold text-sm text-sky-700">StayNest — Student PG Accommodation Finder</h3>
                  <p><strong>1. Title:</strong> StayNest General-Purpose College PG Accommodation Finder</p>
                  <p><strong>2. Introduction:</strong> Platform designed to help students from ANY educational campus (PCCOE, COEP, VIT, IIT Bombay, VJTI) find, compare, and inspect verified PG accommodations.</p>
                  <p><strong>3. Problem Statement:</strong> Outstation students struggle with scattered information, unverified prices, hidden security deposit costs, and unknown distance to college gates.</p>
                  <p><strong>4. Objectives:</strong> Multi-college support, distance matrix, side-by-side comparison, admin moderation queue, verified student peer reviews.</p>
                  <p><strong>5. Technology Stack:</strong> React 18, TypeScript, Tailwind CSS, Leaflet Maps, StorageService engine.</p>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<StayNestApp />);
  </script>
</body>
</html>
